[project]
name = "mydjangox"
version = "1.0.0"
description = "My Django project template. Inspired by Will Vincent's DjangoX."
readme = "README.md"
authors = [
    {name = "Stuart Maxwell", email = "stuart@amanzi.nz"},
]
license = {text = "MIT"}
requires-python = "==3.14.*"
dependencies = [
  "django~=6.0.0",
  "environs[django]~=15.0",
  "gunicorn~=25.3",
  "rich~=15.0",
  "whitenoise~=6.12",
  "django-crispy-forms~=2.6",
  "crispy-bootstrap5~=2026.3",
]

[dependency-groups]
dev = [
    "django-debug-toolbar~=6.3",
    "pytest~=9.0",
    "pytest-django~=4.12",
]

[tool.pdm]
distribution = false

[tool.curlylint.rules]
image_alt = true

[tool.ruff]
line-length = 120
target-version = "py314"

[tool.ruff.lint]
select = ["ALL"]
ignore = [
  "G004",   # Logging statement uses f-string
  "D203",   # 1 blank line required before class docstring
  "D213",   # multi-line-summary-second-line
  "TD003",  # Missing issue link on the line following this TODO
  "FIX002", # Line contains TODO, consider resolving the issue
  "TD002",  # Missing author in TODO
  "S308",   # suspicious-mark-safe-usage
]

[tool.ruff.lint.per-file-ignores]
"test*" = ["ALL"]
"**/migrations/*" = ["ALL"]
"manage.py" = ["ALL"]

[tool.ruff.lint.pydocstyle]
convention = "google" # Accepts: "google", "numpy", or "pep257".

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings_testing"
python_files = "tests.py test_*.py *_tests.py"
